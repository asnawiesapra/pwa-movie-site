<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — PWA Movie Site</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center;
        background:#0b1120; color:#e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align:center; padding:24px; }
      h1 { font-size:1.5rem; margin:0 0 8px; }
      p { color:#94a3b8; margin:0 0 20px; }
      button { background:#f5c518; color:#0b1120; border:0; border-radius:8px;
        padding:12px 24px; font-size:1rem; font-weight:600; cursor:pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Connect to the internet to load new movies.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
